name: specs-extract
# Spec bridge stages 1-5: discover -> extract -> match -> verify -> decide.
# STAGING ONLY: writes staging/ to the `specs` branch. Never touches main or dist.
# A site that returns nothing keeps its rows from the previous run (--previous).
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'One source id only (blank = all manufacturers)'
        default: ''
      limit:
        description: 'Max pages per source (0 = no limit; use 10 for a quick test)'
        default: '0'
      since:
        description: 'Year for the "recent" coverage columns'
        default: '2023'
permissions:
  contents: write
  issues: write
concurrency: { group: specs-branch, cancel-in-progress: false }
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { ref: dist, path: published }
      - uses: actions/checkout@v5
        with: { ref: specs, path: specs }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Tests
        run: |
          node bridge/extract_test.js
          node bridge/approvals_test.js
      - name: Extract
        run: |
          ARGS="--index published/index.json --out out --since ${{ inputs.since }} --limit ${{ inputs.limit }}"
          if [ -f specs/staging/specs_staging.json ]; then ARGS="$ARGS --previous specs/staging/specs_staging.json"; fi
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          node bridge/extract.js $ARGS
          cat out/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit to specs branch
        working-directory: specs
        run: |
          git config user.name  "specs-bridge"
          git config user.email "specs-bridge@users.noreply.github.com"
          rm -rf staging && mkdir -p staging && cp -r ../out/. staging/
          git add -A
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "extract: $(date -u +%F) only=${{ inputs.only }} limit=${{ inputs.limit }}"
          git push origin HEAD:specs
      - name: Update approvals issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create spec-approvals --color 5319e7 --description "Spec bridge approvals" --force
          NUM=$(gh issue list --label spec-approvals --state open --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then gh issue view "$NUM" --json body --jq .body > current.md; fi
          node bridge/approvals.js render --staging out/specs_staging.json --current current.md --out body.md
          if [ -n "$NUM" ]; then gh issue edit "$NUM" --body-file body.md
          else gh issue create --title "Spec approvals" --label spec-approvals --body-file body.md; fi
          echo "Approvals issue updated: tick boxes there, then run specs-publish." >> "$GITHUB_STEP_SUMMARY"
