name: dist-orphan
# v30.189: one-off clean-up of the dist branch. Rewrites dist as a single commit that holds
# only the catalog files the app reads, dropping the old copy of the app and the weekly
# history. Run with mode=dry-run first: it lists what would be kept and dropped, changes nothing.
# rewrite force-pushes dist. The app keeps working: it reads these files by path, not by commit.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (list only) or rewrite (force-push dist)'
        type: choice
        options: [dry-run, rewrite]
        default: dry-run
permissions:
  contents: write
concurrency: { group: catalog-refresh, cancel-in-progress: false }
jobs:
  orphan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { ref: dist, fetch-depth: 1 }
      - name: Keep the catalog files only
        run: |
          set -euo pipefail
          KEEP="index.json usbc.json manifest.json review.json vocab.json detail"
          echo "## dist-orphan (${{ inputs.mode }})" >> "$GITHUB_STEP_SUMMARY"
          for f in $KEEP; do [ -e "$f" ] && echo "keep: $f" || echo "missing: $f"; done | tee -a "$GITHUB_STEP_SUMMARY"
          git ls-files | grep -Ev '^(index\.json|usbc\.json|manifest\.json|review\.json|vocab\.json|detail/)' | sed 's/^/drop: /' | tee -a "$GITHUB_STEP_SUMMARY" || true
          test -s index.json && test -s manifest.json && test -d detail   # never publish an empty catalog
          if [ "${{ inputs.mode }}" != "rewrite" ]; then echo "Dry run: nothing changed." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git config user.name  'catalog-bot'
          git config user.email 'catalog-bot@users.noreply.github.com'
          git checkout --orphan fresh
          git rm -r -q --cached .
          for f in $KEEP; do [ -e "$f" ] && git add "$f"; done
          git commit -q -m "dist: catalog files only (orphan rewrite $(date -u +%F))"
          git push --force origin fresh:dist
          echo "dist rewritten: $(git ls-files | wc -l) files in one commit." >> "$GITHUB_STEP_SUMMARY"
